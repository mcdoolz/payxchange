# PayXChange — Historical Currency Conversion Calculator
# React/Vite SPA. Built inside a Node Docker container.
# Deployed to Dionysus static sites directory.

[project]
name = "payxchange"
strategy = "script"
source = "external/payxchange"

[build]
build_cmd = "rm -rf /opt/forge-src/.tmp/pmx-build && mkdir -p /opt/forge-src/.tmp/pmx-build && docker run --rm -v /opt/forge-src/external/payxchange:/src:ro -v /opt/forge-src/.tmp/pmx-build:/out node:22-slim sh -c 'cp -a /src/. /tmp/build && cd /tmp/build && npm install --no-audit --no-fund && npm run build && cp -a /tmp/build/dist/. /out/' && rm -rf /workspace/external/payxchange/dist && cp -a /workspace/.tmp/pmx-build /workspace/external/payxchange/dist && rm -rf /workspace/.tmp/pmx-build"
output_dir = "dist"
disk_estimate_mb = 500

[deploy]
artifact_dest = "/opt/forge/services/dionysus/sites/pmx"
health_url = "https://pmx.dforge.ca"
health_timeout_secs = 30
deploy_cmd = "chmod -R a+rX /opt/forge/services/dionysus/sites/pmx && docker exec dionysus nginx -s reload"

[notify]
on_success = ["discord:#ci-builds"]
on_failure = ["discord:#ci-builds"]
